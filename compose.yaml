services:
  silvertrap:
    build: .
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - silvertrap-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 64
    restart: unless-stopped

volumes:
  silvertrap-data:
