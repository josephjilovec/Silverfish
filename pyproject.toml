[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "silvertrap"
version = "0.1.0"
description = "Simulation-first fraud operation reconstruction and evidence research"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
silvertrap = "silvertrap.__main__:main"

[tool.setuptools.packages.find]
include = ["silvertrap*"]

[tool.setuptools.package-data]
silvertrap = ["web/*"]
